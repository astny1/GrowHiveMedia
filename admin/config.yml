backend:
  name: git-gateway
  branch: main

publish_mode: simple

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

collections:
  - name: content
    label: Website Content
    files:
      - file: data/news.json
        name: news
        label: News Posts
        fields:
          - label: News Items
            name: items
            widget: list
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: DD MMM YYYY, time_format: false }
              - { label: Content, name: body, widget: text }

      - file: data/businesses.json
        name: businesses
        label: Featured Businesses
        fields:
          - label: Businesses
            name: items
            widget: list
            summary: "{{name}}"
            fields:
              - { label: Business Name, name: name, widget: string }
              - { label: Category, name: category, widget: string, hint: "e.g. Retail, Mining, Construction" }
              - { label: Location, name: location, widget: string, default: "Kitwe, Zambia" }
              - { label: Description, name: description, widget: text }
              - { label: Website URL, name: website, widget: string, required: false }
              - label: Icon
                name: icon
                widget: select
                default: shop
                options:
                  - { label: Shop, value: shop }
                  - { label: Building, value: building }
                  - { label: Briefcase, value: briefcase }
                  - { label: Gear, value: gear }
                  - { label: Health, value: heart-pulse }
                  - { label: Truck, value: truck }
                  - { label: Laptop, value: laptop }
                  - { label: People, value: people }
